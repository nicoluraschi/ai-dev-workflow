model = "gpt-5.6-sol"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"
approval_policy = "on-request"

# Rendered into ~/.codex/config.toml by install.sh (codex/render_config.py): {HOME} becomes the
# home directory, and the optional ~/.config/ai-workflow/codex-projects.toml is appended for extra
# trusted projects. Without that file only the two generic roots below are trusted.
#
# Per-project settings. Only trust_level is a valid key under [projects.*];
# model / reasoning overrides here are unknown fields (ignored) — set them at
# top level instead.
#
# Trust is scoped to ~/Projects and ~/worktrees, not $HOME, so cloned or downloaded repos are
# never trusted. ~/worktrees holds the worktrees the WorktreeCreate hook places under
# ~/worktrees/<repo>/<branch>.
#
# Consequence worth knowing: the main checkout of this config repo is no longer trusted, so
# `codex-audit` will not run against it. It runs from ~/worktrees/<repo>/... instead, which is
# where that work belongs anyway.

[projects."{HOME}/Projects"]
trust_level = "trusted"

[projects."{HOME}/worktrees"]
trust_level = "trusted"
